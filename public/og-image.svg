  </g>

  <!-- Brand text -->
  <text x="290" y="240" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff">SoD</text>
  <text x="368" y="240" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#EA580C">Pro</text>
  <text x="290" y="272" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.45)" letter-spacing="3">SET ON DESK</text>

  <!-- Main title -->
  <text x="60" y="340" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Driving School</text>
  <text x="60" y="395" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="48" font-weight="800" fill="url(#brand-grad)">Management Suite</text>

  <!-- Description -->
  <text x="60" y="445" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.6)">Complete desktop app for Pakistani driving schools.</text>
  <text x="60" y="475" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.6)">Students, scheduling, finance, vehicles &amp; documents.</text>

  <!-- Free trial badge -->
  <rect x="60" y="510" width="195" height="42" rx="21" fill="url(#brand-grad)"/>
  <text x="85" y="537" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Free 30-Day Trial</text>

  <!-- Right side decorative element -->
  <circle cx="1050" cy="315" r="180" fill="none" stroke="rgba(234,88,12,0.08)" stroke-width="1"/>
  <circle cx="1050" cy="315" r="140" fill="none" stroke="rgba(234,88,12,0.06)" stroke-width="1"/>
  <circle cx="1050" cy="315" r="100" fill="none" stroke="rgba(234,88,12,0.04)" stroke-width="1"/>

  <!-- Floating laptop mockup hint -->
  <g transform="translate(920, 220)">
    <rect width="220" height="145" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(234,88,12,0.2)" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="110" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Screen content lines -->
    <rect x="25" y="25" width="80" height="6" rx="3" fill="rgba(234,88,12,0.4)"/>
    <rect x="25" y="40" width="170" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="25" y="52" width="140" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="25" y="64" width="155" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="25" y="76" width="120" height="4" rx="2" fill="rgba(255,255,255,0.04)"/>
    <rect x="25" y="95" width="60" height="18" rx="4" fill="rgba(234,88,12,0.25)"/>
    <rect x="95" y="95" width="60" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
    <!-- Base -->
    <path d="M20 145 L40 160 L180 160 L200 145 Z" fill="rgba(255,255,255,0.03)" stroke="rgba(234,88,12,0.15)" stroke-width="1"/>
  </g>

  <!-- Bottom tagline -->
  <text x="60" y="600" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.25)">setondesk.com</text>
  <text x="1200" y="600" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.25)" text-anchor="end">Windows Desktop App</text>
